<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Descontos de Mercado</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="top-bar">
    <span id="enderecoCompleto">Digite seu CEP</span>
    <div class="input-endereço" id="inputEndereco">
      <input type="text" id="cepInput" placeholder="Digite seu CEP" maxlength="9"/>
      <i class="fa fa-search icone-lupa" onclick="enviarCep()"></i>
    </div>
  </div>

  <div class="conteudo">
    <div id="Desconto">
      <h2>Bem vindo(a)</h2>
      <span class="desconto-tag">Até 50% de desconto</span>
    </div>

    <div class="mercados">
      <div><img src="/static/imagens/tenda.png" alt="Tenda" title="Tenda (raspagem não implementada)" /></div>
      <div><img src="/static/imagens/carrefour.png" alt="Carrefour" title="Carrefour (raspagem não implementada)" /></div>
      <div><img src="/static/imagens/atacadao-logo-1.png" alt="Atacadão" title="Atacadão (raspagem não implementada)" /></div>

      <div title="Clique para buscar novas ofertas no Pão de Açúcar" onclick="iniciarRaspagem('Pão de Açúcar')">
        <img src="/static/imagens/pao-de-acucar-logo-.png" alt="Pão de Açúcar" />
      </div>

      <div><img src="/static/imagens/logoRicoySupermercados.png" alt="Ricoy" title="Ricoy (raspagem não implementada)"/></div>
      <div><img src="/static/imagens/04.png" alt="Extra" title="Extra (raspagem não implementada)"/></div>
    </div>

    <div class="descontos-header">
      <span>Descontos aqui! <span class="verde">%</span></span>
      <span class="vermelho" id="verMais">Ver mais</span>
    </div>

    <div class="produtos" id="produtosContainer">
      </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
