<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Descontos de Mercado</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="top-bar">
    <span id="enderecoCompleto">Digite seu CEP</span>
    <div class="input-endereço" id="inputEndereco">
      <input type="text" id="cepInput" placeholder="Digite seu CEP" maxlength="9"/>
      <i class="fa fa-search icone-lupa" onclick="enviarCep()"></i>
    </div>
  </div>

  <div class="conteudo">
    <div id="Desconto">
      <h2>Bem vindo(a)</h2>
      <span class="desconto-tag">Até 50% de desconto</span>
    </div>

    <div class="mercados">

      <div>
        <img src="/static/imagens/pao-de-acucar-logo-.png" alt="Pão de Açúcar" title="Ver ofertas salvas do Pão de Açúcar" onclick="filtrarPorMercado('Pão de Açúcar')" />
        <i class="fa fa-sync-alt icone-atualizar" title="Buscar novas ofertas no Pão de Açúcar (lento)" onclick="iniciarRaspagem('Pão de Açúcar')"></i>
      </div>

      <div>
        <img src="/static/imagens/carrefour.png" alt="Carrefour" title="Ver ofertas salvas do Carrefour" onclick="filtrarPorMercado('Carrefour')" />
        <i class="fa fa-sync-alt icone-atualizar" title="Buscar novas ofertas no Carrefour (lento)" onclick="iniciarRaspagem('Carrefour')"></i>
      </div>

      <div><img src="/static/imagens/tenda.png" alt="Tenda" /></div>
      <div><img src="/static/imagens/atacadao-logo-1.png" alt="Atacadão" /></div>
      <div><img src="/static/imagens/logoRicoySupermercados.png" alt="Ricoy" /></div>
      <div><img src="/static/imagens/04.png" alt="Extra" /></div>
    </div>

    <div class="descontos-header">
      <span>Descontos aqui! <span class="verde">%</span></span>
      <span class="vermelho" id="verMais">Ver mais</span>
    </div>

    <div style="text-align: center; margin: 20px 0;">
        <button class="produto-btn" style="width: auto; padding: 10px 20px;" onclick="filtrarPorMercado(null)">Ver Todas as Ofertas Salvas</button>
    </div>

    <div class="produtos" id="produtosContainer">
      </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
